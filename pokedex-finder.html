*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f13;color:#e0e0e0;min-height:100vh}
a{color:#5ab3f5}
header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);padding:24px 20px;border-bottom:2px solid #3d7de0}
header h1{font-size:1.8rem;font-weight:700;color:#fff;letter-spacing:-.5px}
header p{color:#999;font-size:.9rem;margin-top:6px;max-width:900px;line-height:1.45}
header .back{font-size:.8rem;display:inline-block;margin-top:10px}
.tabs{display:flex;background:#16161f;border-bottom:1px solid #252535;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 20px;cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;color:#666;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tab .cnt{font-size:.72rem;background:#252535;color:#999;padding:2px 7px;border-radius:10px}
.tab.on{color:#fff;border-bottom-color:var(--c)}
.ctrl{background:#16161f;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #252535;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.ctrl input[type=search]{flex:1;min-width:180px;padding:8px 14px;background:#0f0f13;border:1px solid #252535;border-radius:8px;color:#e0e0e0;font-size:.9rem;outline:none}
.ctrl input[type=search]:focus{border-color:#3d7de0}
.seg{display:flex;border:1px solid #252535;border-radius:20px;overflow:hidden}
.seg button{background:#0f0f13;color:#888;border:none;padding:7px 14px;font-size:.78rem;cursor:pointer}
.seg button.on{background:#3d7de0;color:#fff}
.ctrl label{font-size:.78rem;color:#999;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
main{padding:18px 20px 60px;max-width:1200px;margin:0 auto}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#16161f;border:1px solid #252535;border-radius:10px;padding:12px 18px;min-width:150px}
.stat .v{font-size:1.4rem;font-weight:700;color:#fff}
.stat .l{font-size:.72rem;color:#777;margin-top:2px}
.note{background:#16161f;border:1px solid #252535;border-radius:10px;padding:12px 16px;font-size:.8rem;color:#aaa;margin-bottom:16px;line-height:1.5}
.note b{color:#ddd}
.blk{background:#16161f;border:1px solid #252535;border-radius:12px;margin-bottom:10px;overflow:hidden}
.bh{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;user-select:none}
.bh:hover{background:#1c1c2c}
.bh img.spr{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;flex-shrink:0}
.bh .t{flex:1;min-width:0}
.bh .nm{font-weight:700;color:#eee;font-size:.95rem}
.bh .sub{font-size:.72rem;color:#777;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh .n{font-size:.72rem;background:#252535;color:#bbb;padding:3px 9px;border-radius:10px;white-space:nowrap}
.bh .chev{color:#555;font-size:.75rem;transition:transform .2s}
.blk.open .chev{transform:rotate(90deg)}
.bb{display:none;padding:0 14px 12px;overflow-x:auto}
.blk.open .bb{display:block}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:#666;font-weight:500;padding:6px 8px;border-bottom:1px solid #252535}
td{padding:6px 8px;border-bottom:1px solid #1c1c2a;color:#ccc;vertical-align:middle}
tr:hover td{background:#1c1c2c}
td.th{width:44px}
td.th img{width:36px;height:50px;object-fit:cover;border-radius:3px;background:#111120;display:block}
td.num{font-family:ui-monospace,Consolas,monospace;color:#9ab;white-space:nowrap}
.rar{display:inline-block;font-size:.68rem;padding:2px 7px;border-radius:8px;background:#252535;color:#bbb;white-space:nowrap}
.rar.c{color:#999}.rar.u{color:#8bc34a}.rar.r{color:#44aa99}.rar.hi{color:#ffb74d;background:#3a2a10}.rar.p{color:#90a4ae}
.date{color:#666;font-size:.72rem;white-space:nowrap}
.none{margin-top:18px}
.none h3{font-size:.85rem;color:#999;margin-bottom:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72rem;background:#1c1c2a;border:1px solid #2a2a3a;color:#aaa;padding:3px 9px;border-radius:12px}
.ov td.e{text-align:center;font-weight:600}
.ov td.e.z{color:#444;font-weight:400}
.ov td.e.y{color:#7fc97f}
.ov tr.miss td{background:#221418}
.empty{color:#666;padding:30px;text-align:center}
@media (max-width:600px){table{font-size:.74rem}td,th{padding:5px 4px}td.th{width:34px}td.th img{width:28px;height:39px}.date{display:block}.bb{padding:0 6px 10px}.bh{padding:8px 10px;gap:8px}.bh img.spr{width:40px;height:40px}header h1{font-size:1.35rem}main{padding:14px 12px 50px}.ctrl{padding:10px 12px}.stat{flex:1;min-width:130px}}

  var cards=eraCards(cur).filter(function(c){if(noP&&isPromo(c[1]))return false;if(!q)return true;var s=DATA.sets[c[1]];
    return (MON[c[0]][1]+' '+c[0]+' '+s[1]+' '+c[2]+' '+c[3]+' '+c[4]).toLowerCase().indexOf(q)>-1;});
  var monsIn={},setsIn={};cards.forEach(function(c){(monsIn[c[0]]=monsIn[c[0]]||[]).push(c);(setsIn[c[1]]=setsIn[c[1]]||[]).push(c);});
  var era=ERAS.filter(function(e){return e.k===cur;})[0];
  h+='<div class="summary"><div class="stat"><div class="v" style="color:'+era.c+'">'+Object.keys(monsIn).length+'</div><div class="l">of '+DATA.mons.length+' needed Pokémon</div></div><div class="stat"><div class="v">'+cards.length+'</div><div class="l">cards to choose from</div></div><div class="stat"><div class="v">'+Object.keys(setsIn).length+'</div><div class="l">sets</div></div></div>';
  if(cur==='me')h+='<div class="note">Mega Evolution era includes 30th Celebration, its Classic Collection and the MEP promos. <b>Black Bolt and White Flare</b> are listed under Scarlet &amp; Violet; officially they are the last SV sets, though the wishlist files them under Mega Evolution.</div>';
  if(!cards.length){h+='<div class="empty">No cards match.</div>';}
  else if(view==='mon'){
    Object.keys(monsIn).map(Number).sort(function(a,b){return a-b;}).forEach(function(d){
      var cs=monsIn[d].sort(function(a,b){return DATA.sets[b[1]][2].localeCompare(DATA.sets[a[1]][2])||a[2].localeCompare(b[2],undefined,{numeric:true});});
      var setNames=[];cs.forEach(function(c){var n=DATA.sets[c[1]][1];if(setNames.indexOf(n)<0)setNames.push(n);});
      var body='<table><tr><th></th><th>Set</th><th>Number</th><th>Card</th><th>Rarity</th></tr>'+cs.map(function(c){return row(c,false);}).join('')+'</table>';
      h+=blk('#'+String(d).padStart(4,'0')+' '+esc(MON[d][1]),esc(setNames.join(' · ')),cs.length+' card'+(cs.length>1?'s':''),body,sprite(d),exp);
    });
  }else{
    Object.keys(setsIn).map(Number).sort(function(a,b){
      var ma={},mb={};setsIn[a].forEach(function(c){ma[c[0]]=1;});setsIn[b].forEach(function(c){mb[c[0]]=1;});
      return Object.keys(mb).length-Object.keys(ma).length||DATA.sets[b][2].localeCompare(DATA.sets[a][2]);
    }).forEach(function(si){
      var s=DATA.sets[si],cs=setsIn[si].sort(function(a,b){return a[2].localeCompare(b[2],undefined,{numeric:true});});
      var mm={};cs.forEach(function(c){mm[c[0]]=1;});var nm=Object.keys(mm).length;
      var body='<table><tr><th></th><th>Pokémon</th><th>Number</th><th>Card</th><th>Rarity</th></tr>'+cs.map(function(c){return row(c,true);}).join('')+'</table>';
      h+=blk(esc(s[1]),'Released '+s[2]+(s[4]?' · '+s[4]+' cards in set':''),nm+' Pokémon · '+cs.length+' card'+(cs.length>1?'s':''),body,'',exp);
    });
  }
  if(!q){var none=DATA.mons.filter(function(m){return !COUNTS[cur][m[0]];});
    if(none.length)h+='<div class="none"><h3>Not available in '+esc(era.n)+' ('+none.length+')</h3><div class="chips">'+none.map(function(m){return '<span class="chip">#'+m[0]+' '+esc(m[1])+'</span>';}).join('')+'</div></div>';}
  main.innerHTML=h;
}
render();
</script>
</body></html>
